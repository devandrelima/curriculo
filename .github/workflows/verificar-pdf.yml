name: Verificar PDF A4 (uma pagina)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-a4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ferramentas para teste de impressao
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          npm install --no-save playwright-core@1.58.2
      - name: Compilar site com caminho do GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /curriculo/
      - name: Renderizar A4 com Playwright e Google Chrome
        shell: bash
        run: |
          set -euo pipefail
          VITE_BASE_PATH=/curriculo/ npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/curriculo/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/curriculo/ >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core'
          const browser = await chromium.launch({channel: 'chrome', headless: true, args: ['--no-sandbox']})
          const page = await browser.newPage({viewport: {width: 1200, height: 900}, deviceScaleFactor: 1})
          const errors = []
          page.on('pageerror', error => errors.push(String(error)))
          const response = await page.goto('http://127.0.0.1:4173/curriculo/?lang=pt', { waitUntil: 'networkidle', timeout: 30000 })
          if (!response?.ok()) throw new Error('Status HTTP invalido ao abrir o curriculo: ' + response?.status())
          try {
            await page.locator('.cv-print__project').first().waitFor({state: 'attached', timeout: 15000})
          } catch {
            console.error('Erros JS:', errors)
            console.error('Body:', (await page.locator('body').innerText()).slice(0, 1600))
            throw new Error('O curriculo React nao renderizou a area para impressao')
          }
          await page.emulateMedia({media: 'print'})
          await page.pdf({
            path: '/tmp/curriculo-andre-a4.pdf',
            format: 'A4',
            preferCSSPageSize: true,
            printBackground: true,
            displayHeaderFooter: false
          })
          if (errors.length) console.warn('Erros JS observados:', errors)
          await browser.close()
          NODE
          pdfinfo /tmp/curriculo-andre-a4.pdf
          pages=$(pdfinfo /tmp/curriculo-andre-a4.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" = "1" || { echo "ERRO: o curriculo gerou $pages paginas, esperado 1."; exit 1; }
          pdftotext -layout /tmp/curriculo-andre-a4.pdf /tmp/cv.txt
          grep -qi "CaixaFuturo" /tmp/cv.txt
          grep -qi "Compass UOL" /tmp/cv.txt
          grep -qi "PET-Saúde SUS Digital" /tmp/cv.txt
          grep -qi "Programa Data" /tmp/cv.txt
          grep -qi "Arboviroses" /tmp/cv.txt
          ! grep -qi "Agenda Já" /tmp/cv.txt
          echo "OK: PDF A4 em uma pagina; Arboviroses, IA e experiencias presentes."
      - name: Disponibilizar PDF de verificacao
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Curriculo-Andre-A4
          path: /tmp/curriculo-andre-a4.pdf
          retention-days: 14
